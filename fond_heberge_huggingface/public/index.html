<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VideoVerse TV • Live IPTV</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='80'>📺</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12"></script>
<style>
/* ══════════════════════════════════════════════════════════════
   ░░░ BLOCAGE ADS ULTRA-PUISSANT ░░░
   ══════════════════════════════════════════════════════════════ */
iframe[src*="ads"],iframe[src*="doubleclick"],iframe[src*="googlesyndication"],
iframe[src*="adnxs"],iframe[src*="cdn4ads"],iframe[src*="taboola"],
iframe[src*="outbrain"],iframe[src*="mgid"],iframe[src*="revcontent"],
iframe[src*="popads"],iframe[src*="popcash"],iframe[src*="propeller"],
iframe[src*="adcash"],iframe[src*="clickadu"],iframe[src*="exoclick"],
div[class*="ad-"],div[id*="ad-"],div[class*="banner"],div[class*="popup"],
a[href*="doubleclick"],a[href*="cdn4ads"],a[href*="popads"],[data-ad],
.adsbygoogle,ins.adsbygoogle,.ad-container,.pub-container,.advertisement,
div[style*="z-index: 9999"]:not(.modal):not(#toasts),
div[style*="z-index:9999"]:not(.modal):not(#toasts),
div[style*="position: fixed"][style*="top: 0"]:not(nav):not(header),
div[style*="position:fixed"][style*="top:0"]:not(nav):not(header){
  display:none!important;visibility:hidden!important;
  pointer-events:none!important;opacity:0!important;
  width:0!important;height:0!important;
}

:root{
  --bg:#080d1a;--bg2:#0e1526;--sf:#141e33;--s2:#1b2640;--s3:#22304f;
  --b1:rgba(255,255,255,.07);--b2:rgba(255,255,255,.13);
  --ac:#4f7cff;--a2:#7c5cfc;--gr:#22d3a4;--rd:#ff5566;--gd:#f5a623;
  --tx:#e8edf8;--t2:#8892b0;--t3:#4a5578;
  --fn:'Outfit',sans-serif;--r:12px;--rs:8px;--tr:.14s ease;
  --nav:56px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fn);background:var(--bg);color:var(--tx);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:2px}
::-webkit-scrollbar-track{background:transparent}

/* ══ NAV ══ */
nav{position:fixed;top:0;left:0;right:0;height:var(--nav);
  background:var(--bg2);border-bottom:1px solid var(--b1);
  display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100}
.logo{font-size:20px;font-weight:700;color:var(--ac);
  background:linear-gradient(135deg,var(--ac),var(--a2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:-.5px}
.search{flex:1;max-width:400px;position:relative}
.search input{width:100%;height:36px;background:var(--sf);border:1px solid var(--b1);
  border-radius:20px;padding:0 40px 0 38px;color:var(--tx);font-size:14px;
  transition:var(--tr)}
.search input:focus{outline:none;border-color:var(--ac);background:var(--s2)}
.search .mi{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font-size:18px;color:var(--t2);pointer-events:none}
.search button{position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:50%;background:transparent;border:none;
  color:var(--t2);cursor:pointer;display:none;transition:var(--tr)}
.search button:hover{background:var(--b1);color:var(--tx)}
.search input:not(:placeholder-shown)~button{display:flex;align-items:center;justify-content:center}

.nav-btns{display:flex;gap:8px;margin-left:auto}
.nav-btn{height:36px;padding:0 16px;background:var(--sf);border:1px solid var(--b1);
  border-radius:18px;color:var(--tx);font-size:14px;font-weight:500;
  cursor:pointer;display:flex;align-items:center;gap:6px;transition:var(--tr)}
.nav-btn:hover{background:var(--s2);border-color:var(--b2)}
.nav-btn.primary{background:var(--ac);border-color:var(--ac);color:#fff}
.nav-btn.primary:hover{background:var(--a2);border-color:var(--a2)}
.nav-btn .mi{font-size:18px}

/* ══ LAYOUT ══ */
.main{position:fixed;top:var(--nav);left:0;right:0;bottom:0;
  display:flex;flex-direction:column}

/* ══ PILLS (Filters) ══ */
.pills{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;
  border-bottom:1px solid var(--b1);scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{padding:8px 16px;background:var(--sf);border:1px solid var(--b1);
  border-radius:20px;font-size:13px;font-weight:500;color:var(--t2);
  cursor:pointer;white-space:nowrap;transition:var(--tr);flex-shrink:0}
.pill:hover{background:var(--s2);color:var(--tx)}
.pill.active{background:var(--ac);border-color:var(--ac);color:#fff}
.pill .mi{font-size:16px;vertical-align:middle;margin-right:4px}

/* ══ GRID WRAP ══ */
.gw{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;position:relative}

/* ══ GRID HEADER ══ */
.gh{padding:16px;background:var(--bg2);border-bottom:1px solid var(--b1);
  position:sticky;top:0;z-index:10;backdrop-filter:blur(10px)}
.gh-title{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.gh-count{font-size:13px;color:var(--t2);margin-top:4px}

/* ══ GRID ══ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;padding:16px}
.card{background:var(--sf);border:1px solid var(--b1);border-radius:var(--r);
  padding:12px;cursor:pointer;position:relative;overflow:hidden;
  transition:var(--tr)}
.card:hover{background:var(--s2);border-color:var(--b2);transform:translateY(-2px)}
.card.now{border-color:var(--ac);background:var(--s2)}
.card.now::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--ac),var(--a2))}
.cflag{position:absolute;top:8px;right:8px;font-size:20px;opacity:.7}
.clogo{width:48px;height:48px;object-fit:contain;border-radius:var(--rs);
  margin:0 auto 8px;display:block;background:var(--s2)}
.cfb{width:48px;height:48px;margin:0 auto 8px;background:var(--s2);
  border-radius:var(--rs);display:flex;align-items:center;justify-content:center}
.cfb .mi{font-size:24px;color:var(--t2)}
.cname{font-size:14px;font-weight:600;margin-bottom:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctag{font-size:12px;color:var(--t2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.nowico{position:absolute;bottom:8px;right:8px;color:var(--ac)}
.nowico .mi{font-size:20px}

/* ══ LOADING SENTINEL ══ */
.sentinel{padding:20px;text-align:center;color:var(--t2);font-size:13px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.sentinel .spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ EMPTY STATE ══ */
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--t2)}
.empty .mi{font-size:64px;opacity:.3;margin-bottom:12px}
.empty p{font-size:15px}

/* ══ PLAYER ══ */
#player{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);
  border-top:1px solid var(--b1);z-index:200;display:none;flex-direction:column;
  max-height:50vh}
#pinfo{display:none;padding:12px 16px;border-bottom:1px solid var(--b1);
  align-items:center;gap:12px}
#plogo{width:40px;height:40px;border-radius:var(--rs);object-fit:contain;background:var(--sf)}
#pdetails{flex:1;min-width:0}
#pname{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pgroup{font-size:12px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pclose{width:32px;height:32px;border-radius:50%;background:var(--sf);border:none;
  color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:var(--tr)}
#pclose:hover{background:var(--s2)}
#pvideo{width:100%;height:240px;background:#000;display:block}
#pCtrls{display:none;padding:12px 16px;align-items:center;gap:12px}
.pctrl{background:var(--sf);border:1px solid var(--b1);border-radius:20px;
  padding:8px 16px;color:var(--tx);font-size:13px;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:var(--tr)}
.pctrl:hover{background:var(--s2)}
.pctrl .mi{font-size:18px}
#pstatus{flex:1;font-size:12px;color:var(--t2);text-align:right}

/* ══ TOAST ══ */
#toasts{position:fixed;top:calc(var(--nav) + 12px);right:12px;z-index:300;
  display:flex;flex-direction:column;gap:8px}
.toast{background:var(--sf);border:1px solid var(--b1);border-radius:var(--r);
  padding:12px 16px;min-width:280px;display:flex;align-items:center;gap:12px;
  animation:slideIn .3s ease}
.toast.error{border-color:var(--rd);background:rgba(255,85,102,.1)}
.toast.success{border-color:var(--gr);background:rgba(34,211,164,.1)}
.toast .mi{font-size:20px}
.toast.error .mi{color:var(--rd)}
.toast.success .mi{color:var(--gr)}
.toast-msg{flex:1;font-size:13px}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ══ RESPONSIVE ══ */
@media(max-width:768px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:12px}
  .card{padding:10px}
  .clogo,.cfb{width:40px;height:40px}
  .cname{font-size:13px}
  .nav-btn span:not(.mi){display:none}
  #player{max-height:60vh}
}
</style>
</head>
<body>

<!-- ══ NAV ══ -->
<nav>
  <div class="logo">📺 VideoVerse</div>
  <div class="search">
    <span class="mi">search</span>
    <input type="text" id="searchInput" placeholder="Rechercher une chaîne..." autocomplete="off">
    <button id="clearSearch"><span class="mi">close</span></button>
  </div>
  <div class="nav-btns">
    <button class="nav-btn" onclick="location.href='/streaming'">
      <span class="mi">movie</span>
      <span>Films & Séries</span>
    </button>
  </div>
</nav>

<!-- ══ MAIN ══ -->
<div class="main">
  <!-- Pills -->
  <div class="pills" id="pills"></div>
  
  <!-- Grid Wrapper -->
  <div class="gw" id="gw">
    <div class="gh">
      <div class="gh-title" id="gtitle">📺 Toutes les chaînes</div>
      <div class="gh-count" id="gcnt">Chargement...</div>
    </div>
    <div class="grid" id="chGrid"></div>
    <div class="sentinel" id="sentinel" style="display:none">
      <span class="mi spin">refresh</span>
      <span id="sentinelTxt">Chargement...</span>
    </div>
  </div>
</div>

<!-- ══ PLAYER ══ -->
<div id="player">
  <div id="pinfo">
    <img id="plogo" src="" alt="">
    <div id="pdetails">
      <div id="pname"></div>
      <div id="pgroup"></div>
    </div>
    <button id="pclose"><span class="mi">close</span></button>
  </div>
  <video id="pvideo" controls autoplay playsinline></video>
  <div id="pCtrls">
    <button class="pctrl" id="pRetry"><span class="mi">refresh</span> Réessayer</button>
    <button class="pctrl" id="pPip"><span class="mi">picture_in_picture_alt</span> PiP</button>
    <div id="pstatus">En direct</div>
  </div>
</div>

<!-- ══ TOASTS ══ -->
<div id="toasts"></div>

<script>
// ══════════════════════════════════════════════════════════════
// ░░░ ÉTAT GLOBAL ░░░
// ══════════════════════════════════════════════════════════════
const S = {
  all: [],
  filtered: [],
  countries: [],
  groups: [],
  currentCh: null,
  currentFilter: 'all',
  searchTerm: '',
  dispIdx: 0,
  pageSize: 100,  // Charger 100 chaînes à la fois
  scrollLoading: false,
  dataSaver: false,
};

// Drapeaux pays
const F = {
  'MG':'🇲🇬','FR':'🇫🇷','RE':'🇷🇪','MU':'🇲🇺','US':'🇺🇸','GB':'🇬🇧',
  'ES':'🇪🇸','IT':'🇮🇹','DE':'🇩🇪','BR':'🇧🇷','CA':'🇨🇦','JP':'🇯🇵',
  'CN':'🇨🇳','IN':'🇮🇳','AR':'🇦🇷','AU':'🇦🇺','BE':'🇧🇪','CH':'🇨🇭',
};

// Noms pays
const CN = {
  'MG':'Madagascar','FR':'France','RE':'Réunion','MU':'Maurice','US':'USA','GB':'UK',
  'ES':'Espagne','IT':'Italie','DE':'Allemagne','BR':'Brésil','CA':'Canada',
};

// Icônes catégories
const ICON = {
  news:'newspaper',sport:'sports_soccer',movies:'movie',music:'music_note',
  kids:'child_care',general:'tv',entertainment:'theaters',religious:'church',
};

// ══════════════════════════════════════════════════════════════
// ░░░ TOAST NOTIFICATIONS ░░░
// ══════════════════════════════════════════════════════════════
function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  const icon = type === 'error' ? 'error' : type === 'success' ? 'check_circle' : 'info';
  t.innerHTML = `<span class="mi">${icon}</span><div class="toast-msg">${msg}</div>`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

// ══════════════════════════════════════════════════════════════
// ░░░ CHARGEMENT INITIAL DES CHAÎNES ░░░
// ══════════════════════════════════════════════════════════════
async function loadChannels() {
  try {
    document.getElementById('gcnt').textContent = 'Connexion au serveur...';
    
    const res = await fetch('/api/rtm/channels?limit=50000'); // Charger TOUTES les chaînes
    if (!res.ok) throw new Error('Network error');
    
    const data = await res.json();
    S.all = data.channels || [];
    
    console.log('📺 Chaînes chargées:', S.all.length);
    
    if (S.all.length === 0) {
      throw new Error('Aucune chaîne disponible');
    }
    
    // Charger les pays et groupes
    const resC = await fetch('/api/rtm/countries');
    const dataC = await resC.json();
    S.countries = dataC.countries || [];
    
    const resG = await fetch('/api/rtm/groups');
    const dataG = await resG.json();
    S.groups = dataG.groups || [];
    
    // Initialiser
    renderPills();
    applyFilters();
    
    toast(`${S.all.length} chaînes chargées avec succès!`, 'success');
    
  } catch (e) {
    console.error('Erreur chargement:', e);
    toast('Erreur de chargement. Réessayez.', 'error');
    document.getElementById('gcnt').textContent = 'Erreur de chargement';
  }
}

// ══════════════════════════════════════════════════════════════
// ░░░ RENDU PILLS (FILTRES) ░░░
// ══════════════════════════════════════════════════════════════
function renderPills() {
  const w = document.getElementById('pills');
  w.innerHTML = '';
  
  // Pill "Toutes"
  const pAll = document.createElement('div');
  pAll.className = 'pill active';
  pAll.innerHTML = '<span class="mi">tv</span> Toutes';
  pAll.onclick = () => setFilter('all');
  w.appendChild(pAll);
  
  // Pills pays
  S.countries.slice(0, 15).forEach(c => {
    const p = document.createElement('div');
    p.className = 'pill';
    p.innerHTML = `${F[c] || ''} ${CN[c] || c}`;
    p.onclick = () => setFilter('country', c);
    w.appendChild(p);
  });
}

// ══════════════════════════════════════════════════════════════
// ░░░ FILTRAGE ░░░
// ══════════════════════════════════════════════════════════════
function setFilter(type, value) {
  S.currentFilter = type === 'all' ? 'all' : `${type}:${value}`;
  
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  
  applyFilters();
}

function applyFilters() {
  let list = [...S.all];
  
  // Filtre par pays/groupe
  if (S.currentFilter !== 'all') {
    const [type, val] = S.currentFilter.split(':');
    if (type === 'country') {
      list = list.filter(ch => ch.country === val);
    } else if (type === 'group') {
      list = list.filter(ch => ch.group === val);
    }
  }
  
  // Filtre recherche
  if (S.searchTerm) {
    const q = S.searchTerm.toLowerCase();
    list = list.filter(ch =>
      ch.name.toLowerCase().includes(q) ||
      (ch.group || '').toLowerCase().includes(q) ||
      (ch.country || '').toLowerCase().includes(q)
    );
  }
  
  S.filtered = list;
  S.dispIdx = 0;
  
  // Reset grid
  const wrap = document.getElementById('chGrid');
  wrap.innerHTML = '';
  document.getElementById('gw').scrollTop = 0;
  
  // Update titre
  document.getElementById('gtitle').textContent = 
    S.searchTerm ? `🔍 Résultats de recherche` :
    S.currentFilter === 'all' ? `📺 Toutes les chaînes` :
    `📺 ${S.currentFilter.split(':')[1]}`;
  
  document.getElementById('gcnt').textContent = 
    `${S.filtered.length.toLocaleString()} chaîne${S.filtered.length > 1 ? 's' : ''}`;
  
  // Premier rendu
  renderGrid(true);
  
  // Setup infinite scroll
  setupInfiniteScroll();
}

// ══════════════════════════════════════════════════════════════
// ░░░ RENDU GRID AVEC SCROLL INFINI ░░░
// ══════════════════════════════════════════════════════════════
function renderGrid(reset = false) {
  const wrap = document.getElementById('chGrid');
  const sentinel = document.getElementById('sentinel');
  
  if (reset) {
    wrap.innerHTML = '';
    S.dispIdx = 0;
  }
  
  // Charger un lot
  const slice = S.filtered.slice(S.dispIdx, S.dispIdx + S.pageSize);
  S.dispIdx += slice.length;
  
  if (reset && slice.length === 0) {
    wrap.innerHTML = '<div class="empty"><span class="mi">search_off</span><p>Aucune chaîne trouvée</p></div>';
    sentinel.style.display = 'none';
    return;
  }
  
  // Fragment pour performance
  const frag = document.createDocumentFragment();
  slice.forEach(ch => frag.appendChild(makeCard(ch)));
  wrap.appendChild(frag);
  
  // Afficher sentinel si plus de chaînes
  const hasMore = S.dispIdx < S.filtered.length;
  sentinel.style.display = hasMore ? 'flex' : 'none';
  
  if (hasMore) {
    document.getElementById('sentinelTxt').textContent = 
      `${(S.filtered.length - S.dispIdx).toLocaleString()} chaînes restantes`;
  }
}

// ══════════════════════════════════════════════════════════════
// ░░░ CRÉER CARD CHAÎNE ░░░
// ══════════════════════════════════════════════════════════════
function makeCard(ch) {
  const d = document.createElement('div');
  const isNow = S.currentCh && S.currentCh.url === ch.url;
  d.className = 'card' + (isNow ? ' now' : '');
  d.dataset.url = ch.url;
  
  const flag = F[ch.country] || '';
  const showLogo = ch.logo && !S.dataSaver;
  
  const cat = (ch.group || '').toLowerCase();
  const icon = Object.keys(ICON).find(k => cat.includes(k)) || 'general';
  
  d.innerHTML = `
    ${flag ? `<span class="cflag">${flag}</span>` : ''}
    ${showLogo ? 
      `<img class="clogo" src="/api/rtm/img?u=${encodeURIComponent(ch.logo)}" 
           loading="lazy" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
    <div class="cfb" style="${showLogo ? 'display:none' : ''}">
      <span class="mi">${ICON[icon]}</span>
    </div>
    <div class="cname">${ch.name}</div>
    <div class="ctag">${ch.group || ''}</div>
    ${isNow ? '<div class="nowico"><span class="mi">play_circle</span></div>' : ''}
  `;
  
  d.onclick = () => playTV(ch);
  return d;
}

// ══════════════════════════════════════════════════════════════
// ░░░ INFINITE SCROLL OBSERVER ░░░
// ══════════════════════════════════════════════════════════════
let scrollObserver = null;

function setupInfiniteScroll() {
  if (scrollObserver) scrollObserver.disconnect();
  
  const sentinel = document.getElementById('sentinel');
  const gw = document.getElementById('gw');
  
  scrollObserver = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting && !S.scrollLoading && S.dispIdx < S.filtered.length) {
      S.scrollLoading = true;
      
      // Charger le prochain lot
      setTimeout(() => {
        renderGrid(false);
        S.scrollLoading = false;
      }, 100);
    }
  }, {
    root: gw,
    rootMargin: '400px', // Charger quand à 400px du bas
    threshold: 0.1,
  });
  
  scrollObserver.observe(sentinel);
}

// ══════════════════════════════════════════════════════════════
// ░░░ PLAYER HLS 24/7 STREAMING ░░░
// ══════════════════════════════════════════════════════════════
let hlsInstance = null;
let retryTimer = null;
let retryCount = 0;
const MAX_RETRIES = 999; // Retry infini!

function playTV(ch) {
  S.currentCh = ch;
  
  // Update UI
  document.querySelectorAll('.card').forEach(c => 
    c.classList.toggle('now', c.dataset.url === ch.url)
  );
  
  // Afficher player
  const player = document.getElementById('player');
  const pinfo = document.getElementById('pinfo');
  const pCtrls = document.getElementById('pCtrls');
  
  player.style.display = 'flex';
  pinfo.style.display = 'flex';
  pCtrls.style.display = 'flex';
  
  // Info chaîne
  document.getElementById('pname').textContent = ch.name;
  document.getElementById('pgroup').textContent = `${ch.group || ''} ${ch.country ? '· ' + (CN[ch.country] || ch.country) : ''}`;
  
  if (ch.logo) {
    document.getElementById('plogo').src = `/api/rtm/img?u=${encodeURIComponent(ch.logo)}`;
    document.getElementById('plogo').style.display = 'block';
  } else {
    document.getElementById('plogo').style.display = 'none';
  }
  
  // Charger stream
  loadStream(ch.url);
}

function loadStream(url) {
  retryCount = 0;
  clearTimeout(retryTimer);
  
  const video = document.getElementById('pvideo');
  const status = document.getElementById('pstatus');
  
  status.textContent = 'Connexion...';
  
  // Proxy URL
  const proxyUrl = `/api/rtm/live?url=${encodeURIComponent(url)}`;
  
  // Cleanup ancien stream
  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }
  
  video.src = '';
  
  // HLS.js
  if (Hls.isSupported()) {
    hlsInstance = new Hls({
      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      lowLatencyMode: false,
      backBufferLength: 90,
      liveSyncDurationCount: 3,
      liveMaxLatencyDurationCount: 10,
      enableWorker: true,
      manifestLoadingTimeOut: 30000,
      manifestLoadingMaxRetry: 10,
      manifestLoadingRetryDelay: 1000,
      levelLoadingTimeOut: 30000,
      levelLoadingMaxRetry: 10,
      fragLoadingTimeOut: 30000,
      fragLoadingMaxRetry: 10,
    });
    
    hlsInstance.loadSource(proxyUrl);
    hlsInstance.attachMedia(video);
    
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(e => console.log('Autoplay blocked:', e));
      status.textContent = '🔴 En direct · 24/7';
      retryCount = 0;
    });
    
    hlsInstance.on(Hls.Events.ERROR, (event, data) => {
      console.error('HLS Error:', data);
      
      if (data.fatal) {
        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            status.textContent = 'Erreur réseau. Retry...';
            retryStream();
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            status.textContent = 'Erreur média. Recovery...';
            hlsInstance.recoverMediaError();
            setTimeout(() => retryStream(), 2000);
            break;
          default:
            status.textContent = 'Erreur. Retry...';
            retryStream();
            break;
        }
      }
    });
    
    // Auto-reconnect si arrêt inattendu
    video.addEventListener('ended', () => {
      if (S.currentCh) {
        console.log('Stream ended unexpectedly, retrying...');
        retryStream();
      }
    });
    
    video.addEventListener('error', () => {
      console.log('Video error, retrying...');
      retryStream();
    });
    
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari natif
    video.src = proxyUrl;
    video.play().catch(e => console.log('Autoplay blocked:', e));
    status.textContent = '🔴 En direct · 24/7';
  } else {
    toast('HLS non supporté sur ce navigateur', 'error');
  }
}

function retryStream() {
  if (!S.currentCh) return;
  if (retryCount >= MAX_RETRIES) return; // Limite de sécurité (même si haute)
  
  retryCount++;
  const delay = Math.min(1000 * retryCount, 10000); // Max 10s
  
  console.log(`Retry ${retryCount} dans ${delay}ms...`);
  document.getElementById('pstatus').textContent = `Reconnexion (${retryCount})...`;
  
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => {
    loadStream(S.currentCh.url);
  }, delay);
}

// ══════════════════════════════════════════════════════════════
// ░░░ CONTRÔLES PLAYER ░░░
// ══════════════════════════════════════════════════════════════
document.getElementById('pRetry').onclick = () => {
  if (S.currentCh) {
    retryCount = 0;
    loadStream(S.currentCh.url);
  }
};

document.getElementById('pPip').onclick = async () => {
  const video = document.getElementById('pvideo');
  try {
    if (document.pictureInPictureElement) {
      await document.exitPictureInPicture();
    } else {
      await video.requestPictureInPicture();
    }
  } catch (e) {
    toast('PiP non supporté', 'error');
  }
};

document.getElementById('pclose').onclick = () => {
  const player = document.getElementById('player');
  player.style.display = 'none';
  
  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }
  
  document.getElementById('pvideo').src = '';
  S.currentCh = null;
  
  document.querySelectorAll('.card').forEach(c => c.classList.remove('now'));
};

const searchInput = document.getElementById('searchInput');
let searchTimeout = null;

searchInput.addEventListener('input', (e) => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    S.searchTerm = e.target.value.trim();
    applyFilters();
  }, 300);
});

document.getElementById('clearSearch').onclick = () => {
  searchInput.value = '';
  S.searchTerm = '';
  applyFilters();
};

// ══════════════════════════════════════════════════════════════
// ░░░ BLOCAGE ADS DYNAMIQUE ░░░
// ══════════════════════════════════════════════════════════════
const adsObserver = new MutationObserver(mutations => {
  mutations.forEach(mutation => {
    mutation.addedNodes.forEach(node => {
      if (node.nodeType === 1) {
        // Bloquer iframes d'ads
        if (node.tagName === 'IFRAME') {
          const src = node.src || '';
          if (/ads?|doubleclick|googlesyndication|pop|banner/i.test(src)) {
            node.remove();
            console.log('🛡️ Ad blocked:', src);
          }
        }
        // Bloquer overlays z-index élevé
        if (node.style && node.style.zIndex > 9000 && !node.classList.contains('modal')) {
          node.remove();
          console.log('🛡️ Overlay blocked');
        }
      }
    });
  });
});

adsObserver.observe(document.body, {
  childList: true,
  subtree: true,
});

// Bloquer window.open popups
window.open = function() {
  console.log('🛡️ Popup blocked');
  return null;
};

  loadChannels();
});

setInterval(async () => {
  try {
    await fetch('/api/rtm/health');
  } catch (e) {
    console.log('Keep-alive failed');
  }
}, 30000);
